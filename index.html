<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stardew Valley Walkthrough — 112 Hari Year 1</title>
<meta name="theme-color" content="#2d6a4f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e1a14;--bg2:#14261c;--card:#1b2f23;--acc:#80ed99;--acc2:#ffd166;--warn:#ff6b6b;--txt:#eef7ee;--mut:#9fb8a8;--line:#2a4436;--goal:#b892ff}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:86px;line-height:1.55}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1b4332,#2d6a4f);padding:14px 16px;border-bottom:2px solid var(--acc)}
header h1{font-size:18px}header p{font-size:12px;color:var(--mut)}
main{max-width:640px;margin:0 auto;padding:12px 12px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin-bottom:8px;color:var(--acc)}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--acc2)}
.card p,.card li{font-size:14px;margin-bottom:6px}
.card ul{padding-left:18px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin:2px 4px 2px 0}
.t-must{background:#2d6a4f;color:#fff}.t-time{background:#3a2f0b;color:#ffd166}.t-warn{background:#4a1515;color:#ff8a8a}.t-info{background:#123;color:#7ec8ff}
.t-goal{background:#2c1f4d;color:var(--goal);border:1px solid var(--goal)}
.day-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.day-head .dnum{background:var(--acc);color:#06210f;font-weight:800;border-radius:10px;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:15px}
.day-head h3{margin:0;font-size:15px}
.warnbox{background:#3d1a1a;border:1px solid #7a2e2e;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.goalbox{background:#123524;border:1px solid #2d6a4f;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.gstep{background:#1e1533;border:1px solid var(--goal);border-radius:10px;padding:10px 12px;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a120d;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--mut);font-size:10px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px}nav button.on{color:var(--acc);font-weight:700}
.tab{display:none}.tab.on{display:block}
.seasonchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:64px;z-index:5;background:var(--bg)}
.seasonchips button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.seasonchips button.on{background:var(--acc);color:#06210f;font-weight:700}
#goalbar{background:#1e1533;border:1px solid var(--goal);border-radius:12px;padding:10px 12px;margin:10px 0;display:flex;align-items:center;gap:10px;font-size:13px}
#goalbar .ge{font-size:24px}
#goalbar button{margin-left:auto;background:var(--goal);border:none;color:#1a1030;font-weight:700;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
#filterbar{display:flex;gap:8px;margin:8px 0}
#filterbar button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px;font-size:13px;cursor:pointer}
#filterbar button.on{background:#2c1f4d;border-color:var(--goal);color:var(--goal);font-weight:700}
#onboard{position:fixed;inset:0;background:rgba(5,10,7,.96);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#onboard .box{max-width:420px;width:100%}
#onboard h2{color:var(--acc);margin-bottom:4px}#onboard p.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.gcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer;display:flex;gap:12px;align-items:center;text-align:left;width:100%;color:var(--txt);font-family:inherit}
.gcard .ge{font-size:32px}.gcard b{font-size:15px}.gcard span{font-size:12px;color:var(--mut);display:block}
.gcard:hover{border-color:var(--goal)}
.cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cal-cell{background:#0f1d15;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px;text-align:center}
.cal-cell b{display:block;color:var(--acc2);font-size:12px}
.cal-cell .fest{color:var(--warn);font-weight:700}
footer{text-align:center;font-size:11px;color:var(--mut);padding:18px 0}
a{color:var(--acc)}
</style>
</head>
<body>
<header><h1>🌱 Stardew Walkthrough</h1><p>112 hari Year 1 • Bahasa Indonesia • Android</p></header>
<main id="app"><p style="text-align:center;color:var(--mut);padding:40px 0">Memuat panduan…</p></main>
<nav id="nav"></nav>
<div id="onboard" style="display:none"></div>
<footer>Fan guide. Stardew Valley © ConcernedApe.</footer>
<script>
const TABS=[["home","🏠","Mulai"],["days","📅","Hari"],["season","🌸","Musim"],["skill","🎒","Skill"],["cal","📆","Kalender"],["goal","🏁","Goals"],["y2","🗓️","Year 2"]];
const GOALS={
 money:{e:"💰",n:"Jadi Sultan",d:"Fokus uang & artisan goods. Kaya secepat mungkin."},
 cc:{e:"🏛️",n:"Community Center",d:"Selesaikan semua bundle di Year 1. Target: Greenhouse!"},
 love:{e:"💕",n:"Nikah Year 1",d:"Kejar 10 hati + married sebelum Year 2."},
 combat:{e:"⚔️",n:"Penakluk Mines",d:"Lantai 120 + Skull Cavern secepat mungkin."},
 chill:{e:"🐢",n:"Santai",d:"Enjoy tanpa tekanan. Fondasi kuat, no stress."}};
let G=null,cur="home",seasonIdx=0,goal=null,filterGoal=false;
function getGoal(){try{return localStorage.getItem("sdw_goal")}catch(e){return null}}
function setGoal(v){try{localStorage.setItem("sdw_goal",v)}catch(e){} goal=v}
function tag(t){const m={must:["t-must","⭐ WAJIB"],time:["t-time","⏱ WAKTU"],warn:["t-warn","⚠️ PERHATIAN"],info:["t-info","ℹ️ INFO"]}[t[0]]||["t-info",t[1]];return `<span class="tag ${m[0]}">${m[1]}</span>`}
function md(s){return (s||"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function gname(id){return GOALS[id]?GOALS[id].e+" "+GOALS[id].n:id}
function stepHtml(s){
 const mine=goal&&s.g&&s.g.includes(goal);
 if(filterGoal&&goal&&s.g&&s.g.length&&!s.g.includes(goal))return "";
 const tags=(s.tags||[]).map(tag).join("");
 const gb=mine?`<span class="tag t-goal">🎯 Tujuanmu</span>`:"";
 const inner=`${tags}${gb}${tags||gb?"<br>":""}${md(s.text)}`;
 return mine?`<div class="gstep">${inner}</div>`:`<p>${inner}</p>`;
}
function goalBar(){
 if(!goal||!GOALS[goal])return "";
 return `<div id="goalbar"><span class="ge">${GOALS[goal].e}</span><div><b>${GOALS[goal].n}</b><br><span style="color:var(--mut);font-size:12px">Langkah 🎯 disorot untuk tujuanmu</span></div><button onclick="showOnboard(true)">Ganti</button></div>`;
}
function renderDays(){
 const S=G.dayplans[seasonIdx];
 let h=`<div class="seasonchips">${G.dayplans.map((s,i)=>`<button class="${i===seasonIdx?"on":""}" onclick="seasonIdx=${i};render()">${s.season}</button>`).join("")}</div>`;
 h+=goalBar();
 if(goal)h+=`<div id="filterbar"><button class="${filterGoal?"on":""}" onclick="filterGoal=!filterGoal;render()">🎯 Hanya langkah tujuanku: ${filterGoal?"ON":"OFF"}</button></div>`;
 h+=`<div class="card"><h2>📅 ${S.season} — Hari per Hari</h2><p style="color:var(--mut)">${md(S.intro)}</p></div>`;
 h+=S.days.map(d=>`<div class="card"><div class="day-head"><div class="dnum">${d.n}</div><h3>${d.title}</h3></div>${d.goal?`<div class="goalbox">🎯 ${md(d.goal)}</div>`:""}${d.steps.map(stepHtml).join("")}${d.warning?`<div class="warnbox">⚠️ ${md(d.warning)}</div>`:""}</div>`).join("");
 return h;
}
function renderSeason(){return G.seasons.map(s=>`<div class="card"><h2>${s.name}</h2><p style="color:var(--mut)">${md(s.intro)}</p>${s.points.map(p=>`<h3>${p.h}</h3><ul>${p.items.map(i=>`<li>${md(i)}</li>`).join("")}</ul>`).join("")}</div>`).join("")}
function renderSkill(){return G.skills.map(s=>`<div class="card"><h2>${s.name}</h2><p>${md(s.desc)}</p><ul>${s.tips.map(t=>`<li>${md(t)}</li>`).join("")}</ul></div>`).join("")}
function renderCal(){return G.calendar.map(c=>`<div class="card"><h2>${c.season}</h2><div class="cal-grid">${c.days.map(d=>`<div class="cal-cell"><b>${d.d}</b>${d.e?`<span class="${d.f?"fest":""}">${d.e}</span>`:""}${d.b?`<br>🎂 ${d.b}`:""}</div>`).join("")}</div></div>`).join("")}
function renderY2(){return `<div class="card"><h2>🗓️ Year 2 — Mode Bebas</h2><p style="color:var(--mut)">Tidak ada lagi deadline harian. Year 2 = kejar Ginger Island, Golden Walnut, Mastery, dan persiapan evaluasi Kakek di Spring Year 3.</p></div>`+G.year2plans.map(s=>`<div class="card"><h2>${s.season}</h2><p style="color:var(--mut)">${md(s.intro)}</p><ul>${s.goals.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div>`).join("")+`<div class="card"><h2>🏝️ Cara Buka Ginger Island</h2><ul>${G.ginger.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div><div class="card"><h2>👴 Evaluasi Kakek — Sistem 21 Poin</h2><ul>${G.grandpa.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div>`}
function renderGoalTab(){return goalBar()+`<div class="card"><h2>🎯 Target Akhir Tahun 1</h2><ul>${G.goals.map(g=>`<li>${md(g)}</li>`).join("")}</ul></div>`+(G.goalpaths?G.goalpaths.map(p=>`<div class="card"><h2>${p.e} Jalur: ${p.name}</h2><ul>${p.steps.map(s=>`<li>${md(s)}</li>`).join("")}</ul></div>`).join(""):"")+(G.marriage?`<div class="card"><h2>💕 Panduan Nikah</h2><ul>${G.marriage.map(m=>`<li>${md(m)}</li>`).join("")}</ul></div>`:"")+`<div class="card"><h2>🏛️ Community Center vs Joja</h2><p>${md(G.cc)}</p></div>`+`<div class="card"><h2>📅 Year 2</h2><p style="color:var(--mut)">Panduan lengkap Year 2 — Ginger Island, Golden Walnut, & persiapan evaluasi Kakek — pindah ke tab sendiri.</p><button class="fbtn" onclick="cur='y2';render()">🗓️ Buka Panduan Year 2</button></div>`}
function render(){const a=document.getElementById("app");
a.innerHTML=cur==="home"?goalBar()+`<div class="card"><h2>🌱 Tentang Panduan Ini</h2>${G.about.map(p=>`<p>${md(p)}</p>`).join("")}</div><div class="card"><h2>🎯 Pilih Tujuanmu</h2><p style="color:var(--mut);font-size:13px">Langkah tiap hari disorot sesuai tujuan yang kamu pilih.</p>${Object.keys(GOALS).map(k=>`<button class="gcard" onclick="setGoal('${k}');document.getElementById('onboard').style.display='none';render()"><span class="ge">${GOALS[k].e}</span><span><b>${GOALS[k].n}</b><span>${GOALS[k].d}</span></span></button>`).join("")}</div><div class="card"><h2>📱 Tips Android</h2><ul>${G.android.map(t=>`<li>${md(t)}</li>`).join("")}</ul></div><div class="card"><h2>⚡ 10 Tips Kilat Pemula</h2><ul>${G.quick.map(t=>`<li>${md(t)}</li>`).join("")}</ul></div>`
:cur==="days"?renderDays()
:cur==="season"?renderSeason():cur==="skill"?renderSkill():cur==="cal"?renderCal():cur==="y2"?renderY2():renderGoalTab();
document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===cur));window.scrollTo(0,0)}
function showOnboard(force){
 const ob=document.getElementById("onboard");
 ob.innerHTML=`<div class="box"><h2>🌱 Selamat datang di Pelican Town!</h2><p class="sub">Pilih tujuan mainmu — langkah tiap hari akan disorot sesuai tujuan ini. Bisa diganti kapan saja.</p>${Object.keys(GOALS).map(k=>`<button class="gcard" onclick="setGoal('${k}');document.getElementById('onboard').style.display='none';render()"><span class="ge">${GOALS[k].e}</span><span><b>${GOALS[k].n}</b><span>${GOALS[k].d}</span></span></button>`).join("")}</div>`;
 ob.style.display="flex";
}
async function init(){const n=document.getElementById("nav");
n.innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]==="home"?"on":""}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("");
n.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
try{G=await(await fetch("data/guide.json")).json();}catch(e){document.getElementById("app").innerHTML="<p style='text-align:center;padding:40px'>Gagal memuat data.</p>";return}
goal=getGoal();
render();
if(!goal||!GOALS[goal])showOnboard(false);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
init();
</script>
</body>
</html>
